<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Coffee House</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">Coffee<span>House</span></a>

      <nav class="nav" id="nav" aria-label="Main navigation">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Home</a></li>
          <li><a href="menu.html" class="nav__link nav__link--active">Menu</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">🌙</button>
        <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section catalog">
      <div class="container">
        <h1 class="section__title">Behind each of our cups hides a story</h1>

        <div class="tabs" role="tablist" aria-label="Menu categories">
          <button class="tab tab--active" type="button" role="tab" aria-selected="true" data-category="coffee">Coffee</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-category="tea">Tea</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-category="dessert">Dessert</button>
        </div>

        <div class="catalog__grid" id="catalog"></div>

        <div class="catalog__more">
          <button class="btn" id="load-more" type="button" hidden>Load more</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <a href="index.html" class="logo">Coffee<span>House</span></a>
      <p>© 2026 Coffee House. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/burger.js"></script>
  <script src="js/products.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
